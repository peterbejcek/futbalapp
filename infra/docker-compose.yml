# FKKNV portál — produkčné nasadenie na JEDEN VPS (Lumadock/Contabo/Hetzner…).
# Jeden server obsluhuje databázu, API aj web; Caddy vybaví HTTPS automaticky.
#
#   cd infra
#   cp .env.example .env      # vyplňte heslá
#   chmod 600 .env
#   docker compose --env-file .env up -d --build
#
# Premenné (POSTGRES_PASSWORD, JWT_SECRET, voliteľne RESEND_*) sú v infra/.env.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fkknv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD je povinný}
      POSTGRES_DB: fkknv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fkknv']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fkknv:${POSTGRES_PASSWORD}@postgres:5432/fkknv?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET je povinný}
      CORS_ORIGIN: https://fkknv.sk
      EMAIL_FROM: ${EMAIL_FROM:-FK Košická Nová Ves <noreply@fkknv.sk>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PORT: 3001
    # migrácie prebehnú automaticky pri štarte (viď Dockerfile.api CMD)

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        # zapeká sa do klientskeho bundle-u pri builde — musí byť verejná adresa API
        NEXT_PUBLIC_API_URL: https://api.fkknv.sk/api/v1
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
